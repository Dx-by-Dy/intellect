# Тексты главной страницы сайта https://dx-by-dy.github.io/intellect/
# Страницы попадают на главную сами (из папок <путь>/docs/), здесь только подписи.
# Ошибка в этом файле не ломает деплой: сайт соберётся с подписями по умолчанию,
# а в Actions появится предупреждение.

title = "Алгоритмы с структуры данных"
eyebrow = "intellect"
lead = "Интерактивные лекции, задачи и разборы."
footer = "Исходники и материалы на GitHub"
footer_url = "https://github.com/Dx-by-Dy/intellect"

# Как подписывать папки вида <слово>-<номер>, если имя не задано явно ниже.
[labels]
session = "Смена {n}"
lecture = "Занятие {n}"

# Группа — папка, в которой лежат занятия (обычно <год>/session-<N>).
# name — заголовок (по умолчанию из [labels]), description — строка под ним,
# links — карточки со ссылками наружу, показываются после страниц группы.
[groups."2026/session-3"]
description = "Структуры данных изнутри: язык C, память, строки, хеш-таблицы."

[[groups."2026/session-3".links]]
label = "GitHub"
title = "Структуры данных изнутри"
description = "Лекции, задачи."
url = "https://github.com/Dx-by-Dy/data-structures-inside"

[groups."2026/session-4"]
description = "Графы и алгоритмы на них."

# Страница — папка с docs/. title по умолчанию берётся из <title> страницы,
# description — из <meta name="description">, label — из [labels].
[pages."2026/session-4/lecture-1"]
description = "Как хранить граф в памяти, обход в глубину и в ширину. Интерактивные демонстрации и задачи по уровням."
