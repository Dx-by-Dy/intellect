# Publish every */docs/ folder to GitHub Pages, keeping its path:
# 2026/session-4/lecture-1/docs/ -> https://<owner>.github.io/<repo>/2026/session-4/lecture-1/
# The site is assembled by scripts/build_pages.py.
# Repository setting required: Settings -> Pages -> Source: GitHub Actions.
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "**/docs/**"
      - "scripts/build_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_pages.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
