# Publish every */docs/ folder to GitHub Pages, keeping its path:
# 2026/session-4/lecture-1/docs/ -> https://<owner>.github.io/<repo>/2026/session-4/lecture-1/
# The site is assembled by scripts/build_pages.py; the root page texts live in site.toml.
# A lesson with scripts/build_site.py gets its docs/ generated here, so the
# workflow runs on every push to main: a change to a page's source must redeploy it.
# Repository setting required: Settings -> Pages -> Source: GitHub Actions.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Runs lesson build scripts, which are not covered by CODEOWNERS, so this job
  # gets a read-only token and the Pages permissions stay in the deploy job.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_pages.py _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
